data:
  # Format must be [[latitiude, longitude], ... ]
  coordinates:
    # [[54.372158, 18.638306], [50.049683, 19.944544], [51.759445, 19.457216], [51.246452, 22.568445], [52.409538, 16.931992], [53.428543, 14.552812], [52.237049, 21.017532], [51.107883, 17.038538]]
    [[51.107883, 17.038538]]
  radius: 10000

time:
  start: 2020-01-01 00:00:00
  end: 2026-01-03 00:00:00
  rollup: daily # hourly|daily|yearly

paging:
  limit: 1000

# Local outputs (what you write to disk)
outputs:
  dir: data/raw
  files:
    openaq:
      locations: locations_dataset_wroclaw.csv
      sensors_metadata: sensors_metadata_wroclaw.csv
      sensors_measurements: sensors_measurement_wroclaw.csv
    meteostat:
      weather_daily: weather_daily_wroclaw.csv

# Source-specific config (what you request / how you call APIs)
sources:
  openaq:
    state:
      last_added_sensor_id: null
      sensors_to_skip: []
  meteostat:
    units: metric
    model: false