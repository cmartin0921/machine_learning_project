data:
  # Format must be [[latitiude, longitude], ... ]
  coordinates:
    # [[54.372158, 18.638306], [50.049683, 19.944544], [51.759445, 19.457216], [51.246452, 22.568445], [52.409538, 16.931992], [53.428543, 14.552812], [52.237049, 21.017532], [51.107883, 17.038538]]
    [[52.237049, 21.017532]]
  radius: 10000

time:
  start: 2024-01-01 00:00:00
  end: 2026-02-05 00:00:00
  rollup: daily # hourly|daily|yearly

paging:
  limit: 1000

# Local outputs (what you write to disk)
outputs:
  dir: data/raw
  files:
    openaq:
      locations: _warsaw_locations.csv
      sensors_metadata: _warsaw_sensors_metadata.csv
      sensors_measurements: _warsaw_sensors_measurements.csv
    meteostat:
      weather_daily: _warsaw_weather_daily.csv

# Source-specific config (what you request / how you call APIs)
sources:
  openaq:
    state:
      last_added_sensor_id: null
      sensors_to_skip: []
  meteostat:
    units: metric
    model: false